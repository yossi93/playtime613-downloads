name: publish-release
on:
  push:
    branches: [main]
    paths: ['parts/**']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the zip and check it
        run: |
          cat $(ls parts/Playtime613-Windows.zip.part* | sort) > Playtime613-Windows.zip
          ls -l Playtime613-Windows.zip
          echo "6993461165b0cee07f41beeaa54e68d991063a2c3be4ee55e8c684eb8aba777d  Playtime613-Windows.zip" | sha256sum -c -
          unzip -l Playtime613-Windows.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.6 Playtime613-Windows.zip --repo "$GITHUB_REPOSITORY" --title "Playtime613 1.0.6 for Windows" --notes "Fixes Add time: extra time now starts from when you add it." --latest
