name: publish-release
on:
  push:
    branches: [main]
    paths: ['parts/**']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the zip and check it
        run: |
          cat $(ls parts/Playtime613-Windows.zip.part* | sort) > Playtime613-Windows.zip
          ls -l Playtime613-Windows.zip
          echo "ded9e4884f43c485af1408929b82212ecc5911bfba84d12fd9550cb790643c60  Playtime613-Windows.zip" | sha256sum -c -
          unzip -l Playtime613-Windows.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.11 Playtime613-Windows.zip --repo "$GITHUB_REPOSITORY" --title "Playtime613 1.0.11 for Windows" --notes "Parents: add your email to Parent controls. Forgot PIN? It emails you a reset code (offline: a code to email us for an unlock code). The grown-up sum is gone." --latest
