name: publish-release
on:
  push:
    branches: [main]
    paths: ['parts/**']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the zip and check it
        run: |
          cat $(ls parts/Playtime613-Windows.zip.part* | sort) > Playtime613-Windows.zip
          ls -l Playtime613-Windows.zip
          echo "a4e60cf92be19ec2ced98317480bb84de406cd4c35f27084e703bc497c8a456f  Playtime613-Windows.zip" | sha256sum -c -
          unzip -l Playtime613-Windows.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.4 Playtime613-Windows.zip --repo "$GITHUB_REPOSITORY" --title "Playtime613 1.0.4 for Windows" --notes "Playtime613 1.0.4 for Windows 10 and 11. Unzip, then double-click Playtime613.exe and enter the license key from your order email. See https://playtime613.com" --latest
